[package]
name = "pgcat"
version = "1.2.0"
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
md-5 = "0.11"
bb8 = "0.9.1"
async-trait = "0.1"
rand = "0.10"
chrono = "0.4"
sha1 = "0.11"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
regex = "1"
num_cpus = "1"
once_cell = "1"
sqlparser = { version = "0.52", features = ["visitor"] }
log = "0.4"
arc-swap = "1"
parking_lot = "0.12.1"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
stringprep = "0.1"
# rustls defaults pull in aws-lc-rs, which needs cmake at build time; stay on ring.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
http-body-util = "0.1.2"
hyper = { version = "1.4.1", features = ["full"] }
hyper-util = { version = "0.1.7", features = ["tokio"] }
phf = { version = "0.14", features = ["macros"] }
exitcode = "1.1.2"
futures = "0.3"
socket2 = { version = "0.6", features = ["all"] }
# nix 0.27+ ships with no default features; admin RELOAD sends SIGINT via nix::sys::signal.
nix = { version = "0.31", features = ["signal"] }
atomic_enum = "0.3"
postgres-protocol = "0.6.5"
fallible-iterator = "0.2"
pin-project = "1"
webpki-roots = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
hickory-resolver = "0.26"
serde_json = "1"
clap = { version = "4.3.1", features = ["derive", "env"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = [
    "json",
    "env-filter",
    "std",
] }
lru = "0.19"
dashmap = "6.2.1"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5.0"

[dev-dependencies]
tokio-test = "0.4.2"

[profile.release]
# Line tables only: enough for perf/flamegraphs and symbolized panics, no size blow-up.
debug = 1
